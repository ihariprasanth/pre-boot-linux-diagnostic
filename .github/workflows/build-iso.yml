name: Build PLDDS ISO

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  pull_request:
    branches: [main]

jobs:
  build-iso:
    runs-on: ubuntu-latest
    # Kernel build is the long pole here — give it real headroom.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison libssl-dev libelf-dev bc rsync curl \
            busybox-static cpio gzip \
            grub-pc-bin grub-efi-amd64-bin xorriso mtools \
            qemu-system-x86

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      # Kernel builds are slow (~20-40 min from scratch). Cache the
      # extracted source + .config/.o files between runs, keyed on the
      # pinned version + our config fragment, so unrelated changes
      # (agent/dashboard/server code) don't force a full rebuild.
      - name: Cache kernel build
        uses: actions/cache@v4
        with:
          path: diagnostic/build/.kernel-src
          key: pldds-kernel-${{ hashFiles('diagnostic/kernel/config/diagnostic.config') }}-${{ hashFiles('diagnostic/build/build-kernel.sh') }}

      - name: Build diagnostic agent (Rust, static)
        run: make agent

      - name: Run agent unit tests
        run: make agent-test

      - name: Build diagnostic kernel (bzImage)
        run: make kernel

      - name: Build initramfs
        run: make initramfs

      - name: Build bootable ISO
        run: bash diagnostic/build/build-iso.sh

      - name: Smoke-test boot under QEMU (serial console, bounded timeout)
        run: bash scripts/run-qemu.sh
        continue-on-error: true # KVM isn't available on standard GH runners; this is best-effort

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: pldds-iso-${{ github.sha }}
          path: diagnostic/build/output/pldds.iso
          retention-days: 30

      - name: Upload vmlinuz + initramfs (for QEMU/debug use)
        uses: actions/upload-artifact@v4
        with:
          name: pldds-boot-artifacts-${{ github.sha }}
          path: |
            diagnostic/build/output/vmlinuz
            diagnostic/build/output/initramfs.cpio.gz
          retention-days: 30
