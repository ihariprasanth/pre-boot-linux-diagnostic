# PLDDS GRUB configuration — Phase 9.
#
# This file defines the three menu entries the boot-flow docs promise
# (docs/boot-flow.md, docs/architecture.md "Core safety invariant"):
#
#   windows          — the persistent default, boots normally, always
#                       present, always manually selectable
#   diagnostic        — PLDDS diagnostic Linux; selected either by hand
#                       from this menu, or via a one-shot `grub-reboot
#                       diagnostic` scheduled by a previous diagnostic
#                       run's /init (see diagnostic/initramfs/init)
#   diagnostic-safe   — recovery/safe-boot variant of the diagnostic
#                       entry: same kernel, extra `pldds.safe=1` kernel
#                       cmdline flag the agent/init can check to skip
#                       anything riskier than the read-only collectors
#                       (e.g. if a previous diagnostic boot itself
#                       crashed before writing a boot decision)
#
# ## What this file deliberately does NOT do
#
# It never sets `set default=` to anything other than "windows", and
# nothing in this repository ever runs `grub-set-default`. The only
# supported way to boot into "diagnostic" is:
#   (a) a human picking it from this menu at POST, or
#   (b) `grub-reboot diagnostic` — a ONE-SHOT override recorded in
#       GRUB's separate `grubenv` environment block, automatically
#       consumed and cleared by the very next boot.
# This is what "one-shot" buys us: if PLDDS's own logic has a bug and
# never runs again, the very next boot after a `grub-reboot diagnostic`
# already reverts to `windows` on its own — no code anywhere (this
# file included) has to remember to undo anything.
#
# ## Installing this file
#
# On a real dual-boot machine this is NOT meant to replace the
# distro's generated grub.cfg wholesale. Phase 13 (Real hardware
# testing) appends the "diagnostic" and "diagnostic-safe" entries
# below into the existing GRUB config via `/etc/grub.d/40_custom` (or
# equivalent) so `update-grub`/`grub-mkconfig` keeps managing the
# Windows entry itself — this file is authoritative for what those
# entries should look like, not a drop-in replacement for the whole
# config.

# Show the menu briefly so a human can intervene; a one-shot
# `grub-reboot` override still fires even with a nonzero timeout, it
# just also gives visibility that something scheduled a diagnostic
# boot.
set timeout=5
set timeout_style=menu

# Persistent default: Windows, always. Never edited at runtime by any
# PLDDS code — see the module docs above and
# docs/architecture.md "Core safety invariant".
set default="windows"

# --- Windows Boot Manager -------------------------------------------------
# `windows` is the fixed entry ID `grub-reboot windows` (called from
# diagnostic/initramfs/init) and the `set default` above both target.
# Do not rename this ID without updating init and this comment
# together — the string is load-bearing, not just a menu label.
menuentry "Windows Boot Manager" --id windows {
    insmod part_gpt
    insmod fat
    insmod chain
    # The real UEFI System Partition/PARTUUID values are filled in at
    # install time (Phase 13) by whatever generated the rest of the
    # host's grub.cfg — PLDDS never invents or hardcodes them here.
    search --no-floppy --fs-uuid --set=root ${EFI_SYSTEM_PARTITION_UUID}
    chainloader /EFI/Microsoft/Boot/bootmgfw.efi
}

# --- PLDDS Diagnostic Linux ------------------------------------------------
# `diagnostic` is the fixed entry ID `grub-reboot diagnostic` (also
# called from init, only for the RETRY_DIAGNOSTIC decision) targets.
menuentry "PLDDS Diagnostic Linux" --id diagnostic {
    insmod part_gpt
    insmod fat
    insmod gzio
    search --no-floppy --fs-uuid --set=root ${PLDDS_BOOT_PARTITION_UUID}
    linux  /pldds/vmlinuz console=ttyS0 console=tty0 quiet
    initrd /pldds/initramfs.cpio.gz
}

# --- PLDDS Diagnostic Linux (safe/recovery mode) --------------------------
# Not scheduled by any automatic logic — manual-selection only. Boots
# the same kernel/initramfs with `pldds.safe=1` on the cmdline, which
# /init and the agent can check to skip anything beyond the read-only
# collectors (useful if a previous diagnostic boot crashed before ever
# reaching the point of writing a boot decision, so a human wants one
# more look without immediately handing off again).
menuentry "PLDDS Diagnostic Linux (safe mode)" --id diagnostic-safe {
    insmod part_gpt
    insmod fat
    insmod gzio
    search --no-floppy --fs-uuid --set=root ${PLDDS_BOOT_PARTITION_UUID}
    linux  /pldds/vmlinuz console=ttyS0 console=tty0 pldds.safe=1
    initrd /pldds/initramfs.cpio.gz
}
